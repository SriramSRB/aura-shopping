apiVersion: apps/v1
kind: Deployment 
metadata:
  name: aura-shopping-deployment 
  labels: 
    project: aura-shopping
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      project: aura-shopping
  template:
    metadata:
      labels:
        project: aura-shopping
    spec:
      containers:
        - name: aura-shopping-container 
          image: sriramsrb/aura-shopping:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"

---

apiVersion: v1
kind: Service
metadata:
  name: aura-shopping-service 
  labels:
    project: aura-shopping
spec:
  type: NodePort
  selector:
    project: aura-shopping
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
      nodePort: 30080
